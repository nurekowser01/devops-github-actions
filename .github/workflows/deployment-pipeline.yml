name: Build, Publish & Deploy

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-node@v4.0.2
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build-scan-publish:
    name: Immutable Artifact Pipeline
    needs: ci-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        
      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
            
      - name: Build Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} .
          
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.15.8
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          
      - name: Archive SBOM
        uses: actions/upload-artifact@v4.3.1
        with:
          name: sbom
          path: sbom.spdx.json
          
      - name: Push Immutable Artifact
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy:
    name: Deploy & Verify
    needs: build-scan-publish
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
            PREVIOUS_IMAGE=$(docker inspect --format "{{.Config.Image}}" app-container || echo "")
            
            echo "Authenticating to GHCR..."
            echo "${{ secrets.DEPLOY_GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.DEPLOY_USER }} --password-stdin
            
            echo "Pulling $IMAGE"
            docker pull $IMAGE
            
            echo "Deploying new container..."
            docker stop app-container || true
            docker rm app-container || true
            docker run -d --name app-container -p 3000:3000 $IMAGE
            
            verify_health() {
              for i in {1..6}; do
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
                if [ "$STATUS" = "200" ]; then return 0; fi
                sleep 5
              done
              return 1
            }
            
            echo "Verifying health..."
            if ! verify_health; then
              echo "Healthcheck FAILED. Initiating rollback to $PREVIOUS_IMAGE..."
              docker stop app-container || true
              docker rm app-container || true
              
              if [ -n "$PREVIOUS_IMAGE" ]; then
                docker run -d --name app-container -p 3000:3000 $PREVIOUS_IMAGE
                echo "Verifying rollback health..."
                if ! verify_health; then
                  echo "CRITICAL: Rollback healthcheck failed. Service is offline."
                  exit 1
                fi
                echo "Rollback successful. Marking deployment as failed."
              else
                echo "CRITICAL: No previous image found. Service is offline."
              fi
              exit 1
            fi
            
            echo "Deployment verified and successful!"

