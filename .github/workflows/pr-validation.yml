name: PR Validation

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: "22"
          cache: "npm"
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Lint Code
        run: npm run lint
        
      - name: Run Unit Tests
        run: npm test

  build-dry-run:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0
        
      - name: Build Image (No Push)
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          push: false
          tags: devops-demo:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

